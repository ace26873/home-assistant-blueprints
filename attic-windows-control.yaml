blueprint:
  name: Attic Windows Control
  description: >
    # 🌤️ Attic Windows Control

    **Version: 1.0**
    
    🚀 Stay Comfortable! Automatically control the attic windows based on temperature and weather conditions.
    
    <details>
    <summary><b>The Automation Process:</b> 👈</summary>

      - **Trigger Options:**
        - **Fixed Time:** Automatically closes windows at a specified time.
        - **Weather-Based Triggers:** Automatically opens or closes windows based on outdoor temperature or rain probability.

      - **Entity Sensors:**
        - Detects indoor and outdoor temperature sensors.
        - Detects rain probability sensors.

      - **Notification Options:**
        - Opt to send messages to one or multiple devices.
        - Opt to use iOS-specific notification features like interruption levels.
        - Compatible with Apple iOS devices.

    </details>

    Required = *
  
  domain: automation
  homeassistant:
    min_version: "2024.6.0"
  input:
    entities_settings:
      name: "Entities Settings *"
      icon: mdi:devices
      description: Configure the windows and temperature sensors.
      collapsed: false
      input:
        attic_windows:
          name: Attic Windows
          description: Select the covers (windows) to be controlled by this automation.
          selector:
            entity:
              domain: cover
              multiple: true

        indoor_temperature_sensor:
          name: Indoor Temperature Sensor
          description: Select the sensor that measures the indoor temperature.
          selector:
            entity:
              domain: sensor
              device_class: temperature

        outdoor_temperature_sensor:
          name: Outdoor Temperature Sensor
          description: Select the sensor that measures the outdoor temperature.
          selector:
            entity:
              domain: sensor
              device_class: temperature

        rain_probability_sensor:
          name: Rain Probability Sensor
          description: Select the sensor that measures the probability of rain.
          selector:
            entity:
              domain: sensor

    temperature_settings:
      name: "Temperature Settings *"
      icon: mdi:thermometer-lines
      description: Configure the temperature difference required to open and close the windows. The closing difference must be lower than the opening difference.
      collapsed: true
      input:
        minimum_indoor_temperature:
          name: Minimum Indoor Temperature
          description: Prevent the windows from opening unless the indoor temperature is at least this value.
          default: 28
          selector:
            number:
              min: 10
              max: 40
              step: 0.5
              unit_of_measurement: "°C"

        open_temperature_difference:
          name: Opening Temperature Difference
          description: Open when the indoor temperature is at least this much warmer than the outdoor temperature.
          default: 2
          selector:
            number:
              min: 0.5
              max: 10
              step: 0.5
              unit_of_measurement: "°C"

        close_temperature_difference:
          name: Closing Temperature Difference
          description: Close when the indoor-to-outdoor temperature difference falls below this value. Keep this lower than the opening difference.
          default: 0.5
          selector:
            number:
              min: 0
              max: 9.5
              step: 0.5
              unit_of_measurement: "°C"

    fixed_time_settings:
      name: "Fixed Time Settings *"
      icon: mdi:clock-outline
      description: Configure the daily period during which the windows may open automatically. They remain closed outside this period.
      collapsed: true
      input:
        open_time:
          name: Opening Period Start
          description: Select when temperature changes may begin opening the windows. Reaching this time does not open them by itself.
          default: "20:00:00"
          selector:
            time: {}

        close_time:
          name: Time to Close Windows
          description: Select the time when the windows should close and remain closed until the next opening period.
          default: "09:00:00"
          selector:
            time: {}

    easy_notify_settings:
      name: "Easy Notify Settings"
      icon: mdi:bell-check-outline
      description: Configure the notification settings.
      collapsed: true
      input:
        include_easy_notify:
          name: Use The Easy Notify - Device Notification Options
          description: Enabling this option will send notifications to the selected devices below.
          default: disabled
          selector:
            select:
              options:
                - label: Enable Device Notification
                  value: "enabled"
                - label: Disable Device Notification
                  value: "disabled"

        notify_device:
          name: Notify Devices
          description: If you've enabled device notifications above, please select the devices to receive the notifications.
          default: []
          selector:
            device:
              integration: mobile_app
              multiple: true

        notify_interruption_level:
          name: Interruption Level - iOS Only
          description: >
            On devices running iOS 15 and later, you can configure the interruption level for your notifications to ensure they are delivered according to your preferences.
            Choose the desired interruption level from the dropdown list.
            Critical and time-sensitive notifications must be turned ON within the Home Assistant App, and time-sensitive notifications must be allowed in your Focus settings.


            For more information on interruption levels [Click Here](https://community.home-assistant.io/t/653754/192?u=blacky).
          default: active
          selector:
            select:
              mode: dropdown
              options:
                - label: Default
                  value: "active"
                - label: Critical Notifications
                  value: "critical"
                - label: Time Sensitive Notifications
                  value: "time-sensitive"
                - label: Quiet Notifications Without Waking Screen
                  value: "passive"

variables:
  include_easy_notify: !input include_easy_notify
  notify_device: !input notify_device
  rain_probability_sensor: !input rain_probability_sensor

trigger_variables:
  indoor_temperature_entity: !input indoor_temperature_sensor
  outdoor_temperature_entity: !input outdoor_temperature_sensor
  minimum_indoor_temperature: !input minimum_indoor_temperature
  open_temperature_difference: !input open_temperature_difference
  close_temperature_difference: !input close_temperature_difference

trigger:
  - platform: time
    at: !input close_time
    id: close_time
  - platform: numeric_state
    entity_id: !input rain_probability_sensor
    above: 0
    id: rain_detected
  - platform: template
    value_template: >-
      {% set indoor = states(indoor_temperature_entity) %}
      {% set outdoor = states(outdoor_temperature_entity) %}
      {% set difference = (indoor | float(0)) - (outdoor | float(0)) %}
      {{ is_number(indoor) and is_number(outdoor)
         and (indoor | float(0)) >= (minimum_indoor_temperature | float(28))
         and difference >= (open_temperature_difference | float(2)) }}
    id: cooler_outside
  - platform: template
    value_template: >-
      {% set indoor = states(indoor_temperature_entity) %}
      {% set outdoor = states(outdoor_temperature_entity) %}
      {% set difference = (indoor | float(0)) - (outdoor | float(0)) %}
      {{ is_number(indoor) and is_number(outdoor)
         and difference < (close_temperature_difference | float(0.5)) }}
    id: warmer_outside

condition: []

action:
  - choose:
      - alias: "Open windows?"
        conditions:
          - condition: trigger
            id: cooler_outside
          - condition: time
            after: !input open_time
            before: !input close_time
          - condition: template
            value_template: "{{ states(rain_probability_sensor) | float(101) <= 0 }}"
        sequence:
          - service: cover.open_cover
            target:
              entity_id: !input attic_windows
          - choose:
              - alias: "Send open notification to devices"
                conditions:
                  - condition: template
                    value_template: "{{ include_easy_notify == 'enabled' }}"
                  - condition: template
                    value_template: "{{ notify_device | length > 0 }}"
                sequence:
                  - repeat:
                      for_each: !input notify_device
                      sequence:
                        - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                          data:
                            message: Attic Windows opened
                            data:
                              push:
                                interruption-level: !input notify_interruption_level
      - alias: "Close windows"
        conditions: []
        sequence:
          - service: cover.close_cover
            target:
              entity_id: !input attic_windows
          - choose:
              - alias: "Send close notification to devices"
                conditions:
                  - condition: template
                    value_template: "{{ include_easy_notify == 'enabled' }}"
                  - condition: template
                    value_template: "{{ notify_device | length > 0 }}"
                sequence:
                  - repeat:
                      for_each: !input notify_device
                      sequence:
                        - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                          data:
                            message: Attic Windows closed
                            data:
                              push:
                                interruption-level: !input notify_interruption_level

mode: single
